# 새 v* 태그의 배포물 빌드.
# - Windows: 설치 프로그램 없는 포터블 단일 exe (ClassMix_{버전}_x64.exe)
# - macOS: 유니버설 .dmg
# 태그(v*)를 올리면 GitHub Release 초안을 만들고 배포물을 붙인다.
name: build

on:
  push:
    tags: ["v*"]

concurrency:
  group: classmix-release-${{ github.event.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/CI.yml

  windows-exe:
    name: windows portable exe
    needs: ci
    if: github.event.created
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: 앱 아이콘 생성
        run: pnpm icons
      # src-tauri/.cargo/config.toml의 +crt-static으로 C 런타임을 정적 링크한다.
      - name: 포터블 exe 빌드
        run: pnpm build:win
      - name: 배포물 이름 붙이기
        id: dist
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $name = "ClassMix_${version}_x64.exe"
          Copy-Item src-tauri/target/release/classmix.exe "dist-release/$name"
          Copy-Item LICENSE, THIRD_PARTY_LICENSES.txt dist-release/
          # 정적 링크 확인: VC 런타임 DLL을 가져오면 실패시킨다.
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          if ($dumpbin) {
            $deps = & $dumpbin.FullName /dependents "dist-release/$name" | Out-String
            Write-Output $deps
            if ($deps -match 'VCRUNTIME140|MSVCP140') { throw "VC 런타임 DLL에 의존합니다(crt-static이 적용되지 않음)." }
          }
          "name=$name" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v7
        with:
          name: ClassMix-windows-x64
          path: |
            dist-release/${{ steps.dist.outputs.name }}
            dist-release/LICENSE
            dist-release/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  macos-dmg:
    name: macos universal dmg
    needs: ci
    if: github.event.created
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: 앱 아이콘 생성
        run: pnpm icons
      - name: dmg 빌드
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v7
        with:
          name: ClassMix-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: github release (draft)
    needs: [windows-exe, macos-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: artifacts/*
