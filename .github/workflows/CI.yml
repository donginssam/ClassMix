name: CI

on:
  push:
    branches: ["**"]
    # v* 태그의 CI는 build.yml에서 호출한다.
    tags-ignore: ["v*"]
  pull_request:
  workflow_call:

concurrency:
  group: classmix-ci-${{ github.event_name }}-${{ github.event.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # 같은 저장소의 PR 브랜치는 push에서 검사한다.
    if: >-
      github.event.deleted != true &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # tauri::generate_context!()가 dist 폴더를 찾으므로 프런트엔드를 먼저 빌드한다.
      - run: pnpm build
      - run: pnpm lint:rust
      - run: pnpm test:rust
