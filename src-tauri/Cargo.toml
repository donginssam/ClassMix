[package]
name = "classmix"
# 앱 버전은 package.json에서 정한다(build.rs, tauri.conf.json 참고). 이 값은 크레이트 메타데이터일 뿐이다.
version = "0.1.0"
description = "나이스 반편성 도우미"
authors = ["Dongin Lee"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "classmix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
umya-spreadsheet = "3.1"
thiserror = "2"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gethostname = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
